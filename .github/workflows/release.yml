name: Publish reviewed AHK release

# Publication requires a fresh owner request and manual workflow dispatch.
# Pushing source, README or workflow changes never publishes a release.
"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: dandyrecruiterahk-v1.1.1
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'nutiler/dandyrecruiterahk' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate source, attach script and publish stable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: python3 {0}
        run: |
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = "nutiler/dandyrecruiterahk"
          version = "1.1.1"
          tag = "v" + version
          filename = "DandyRecruiterHelper.ahk"
          expected = "7db25bf186d3f7da98fc961cb35e5631c7e0fab14a1ffc90dec285e373f7fff6"
          commit = os.environ["RELEASE_COMMIT"]
          token = os.environ["GH_TOKEN"]
          assert re.fullmatch(r"[0-9a-f]{40}", commit), "Invalid commit"
          assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version), "Stable version required"
          assert re.fullmatch(r"[0-9a-f]{64}", expected), "Reviewed script hash required"

          def api(path, method="GET", payload=None, binary=False):
              host = "https://uploads.github.com" if binary else "https://api.github.com"
              url = host + "/repos/" + repo + "/" + path
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "User-Agent": "DandyRecruiterAHK-release",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              data = None
              if payload is not None:
                  data = payload if binary else json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/octet-stream" if binary else "application/json"
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          # Refuse to replace a published release, unresolved draft or old tag.
          releases = api("releases?per_page=100")
          assert len(releases) < 100, "Release history requires a complete audit before publication"
          assert not any(item["tag_name"] == tag for item in releases), "Release/draft already exists; inspect it before retrying"
          try:
              api("git/ref/tags/" + tag)
          except urllib.error.HTTPError as problem:
              if problem.code != 404:
                  raise
          else:
              raise RuntimeError("Tag already exists; never repoint it")

          tree = api("git/trees/" + commit + "?recursive=1")
          allowed = {filename, "README.md", ".github/workflows/release.yml"}
          assert not tree["truncated"], "Incomplete source tree"
          assert {item["path"] for item in tree["tree"] if item["type"] == "blob"} == allowed, "Unexpected public files"
          assert all(item["type"] in {"blob", "tree"} and item["mode"] != "120000" for item in tree["tree"]), "Unexpected source entry"
          source = api("contents/" + filename + "?ref=" + commit)
          assert source["encoding"] == "base64", "Unexpected source encoding"
          script = base64.b64decode(source["content"], validate=False)
          assert hashlib.sha256(script).hexdigest() == expected, "Script differs from reviewed bytes"
          assert "; DandyRecruiterAHK " + version + " -" in script.decode("utf-8-sig"), "Header version mismatch"
          files = {filename: (script, expected)}
          readme = api("contents/README.md?ref=" + commit)
          assert readme["size"] > 0, "Setup instructions missing"

          notes = "\n".join([
              "Download **DandyRecruiterHelper.ahk** under **Assets** below. No source-code ZIP is needed.",
              "",
              "Stable 1.1.1 restores the simple six-tap clipboard flow. Mouse movement does not pause it, there is no idle timeout and no screen pixels or input strip are required. One script includes the floating button and keyboard controls; run one helper at a time.",
              "",
              "Use DandyRecruiter 1.4.0 or later from CurseForge for the matching scan/invite workflow. The addon owns candidates, messages, contact protection, preventive pacing and native-error recovery. This helper has no independent invite limiter or pause checkbox.",
              "",
              "Optional Windows helper for the separately installed DandyRecruiter addon in WoW Forever. Requires AutoHotkey v2.",
              "",
              "1. Install AutoHotkey v2 from https://www.autohotkey.com/.",
              "2. Exit older helper copies, then download the attached script and double-click it. It starts unarmed.",
              "3. In Setup, choose your Step key/button and WoW Recruit next key. Defaults are Up/F8. For a keypad sending Left, choose Left/F8. The addon normally supplies F8; a custom action key must match Key Bindings > Dandy Suite > DandyRecruiter > Recruit next. No action-bar macro is needed.",
              "4. Focus your recruiter client, close chat/copy input and press Ctrl+Alt+your Step key/button to arm. The floating click button appears for that client.",
              "5. Click and release the floating button or press and release your chosen Step key once per step: Recruit next, copy, finish copying, open chat, paste, send. Check the line before the final separate action.",
              "",
              "The floating button keeps WoW focused and names the next action. Close it with X or use tray Show click button to hide it for this session. Use Windowed or Windowed Fullscreen WoW if an exclusive fullscreen window covers the helper.",
              "Extra clicks while an action is still running are ignored and never queued.",
              "",
              "Esc disarms an active cycle. Alt-Tab pauses that client. Holding a key/button does not repeat and extra busy taps are discarded. There is no idle timeout between taps. Keep the expected copy/chat input focused while advancing it.",
              "",
              "The matching addon holds new recruitment for 50 seconds after ten counted native invite submissions and excludes its attributed offline outcomes. A partial batch resets after 30 seconds without a counted submission; an active cooldown finishes in full. Scan commands, whispers and waiting steps do not count. Native rate errors retain their separate 50-second recovery. The Inviter displays the reason and countdown; expiry sends nothing automatically. These are local policies, and WoW still enforces its own limits.",
              "",
              "Mouse movement does not affect the sequence. Step taps while a main mouse button is held are ignored. Releasing ordinary mouse input silently discards an unfinished cycle without sending a key; the next physical step requests a fresh command. Close any unfinished native chat before restarting if it remains open. Floating-button clicks retain their normal step behavior.",
              "",
              "A fresh waiting status uses one separate Escape step before retrying and is never pasted or sent. Unknown copy or unverifiable paste still stops input. Close unfinished native input yourself, then click the stopped helper button or press the arm shortcut. A stopped-button click only re-arms; the next click starts a fresh cycle. The helper attempt total is retained and addon pacing is unchanged.",
              "",
              "Use tray Setup to change controls. Saving disarms every client. The helper shows final invite attempts per armed client without claiming confirmed invitations. The addon is installed separately and keeps its own count for pacing. A command already copied or pasted into native chat cannot be revoked.",
              "",
              "The same six separate taps handle the addon's validated /ginvite, /who and exact /reload recovery command. Enable Include scans between invites in the Inviter to offer due searches between invitations; zero Ready automatically includes scans. A submitted scan gives a freshly Ready recruit the next turn. Scans and reloads do not count as invite attempts, and the final Enter always requires its own tap.",
              "",
              "[Full setup and controls](https://github.com/" + repo + "/blob/" + commit + "/README.md)",
              "",
              "SHA-256 for **" + filename + "**: `" + expected + "`",
          ])
          release = api("releases", "POST", {
              "tag_name": tag, "target_commitish": commit,
              "name": "DandyRecruiterAHK " + version,
              "body": notes, "draft": True, "prerelease": False,
              "generate_release_notes": False,
          })
          release_id = release["id"]
          uploaded = {}
          for name, (payload, digest) in files.items():
              asset = api("releases/" + str(release_id) + "/assets?name=" + urllib.parse.quote(name), "POST", payload, binary=True)
              assert asset["name"] == name and asset["size"] == len(payload), "Asset identity mismatch"
              assert asset["state"] == "uploaded" and asset.get("digest") == "sha256:" + digest, "Asset hash mismatch"
              uploaded[name] = asset["id"]

          def verify_assets(assets):
              assert len(assets) == len(files) and {item["name"] for item in assets} == set(files), "Unexpected release assets"
              for item in assets:
                  payload, digest = files[item["name"]]
                  assert item["id"] == uploaded[item["name"]] and item["size"] == len(payload), "Asset identity mismatch"
                  assert item.get("digest") == "sha256:" + digest, "Asset hash mismatch"

          verify_assets(api("releases/" + str(release_id) + "/assets"))
          published = api("releases/" + str(release_id), "PATCH", {"draft": False, "prerelease": False, "make_latest": "true"})
          assert published["id"] == release_id and published["tag_name"] == tag, "Published release identity mismatch"
          assert published["draft"] is False and published["prerelease"] is False, "Stable publication failed"
          reference = api("git/ref/tags/" + tag)
          assert reference["object"]["type"] == "commit" and reference["object"]["sha"] == commit, "Release tag mismatch"

          # Public readback uses no authentication and never executes the file.
          # Draft URLs can change on publication; re-read the published asset.
          public_assets = api("releases/" + str(release_id) + "/assets")
          verify_assets(public_assets)
          downloads = {}
          for item in public_assets:
              name = item["name"]
              download = item["browser_download_url"]
              assert download == "https://github.com/" + repo + "/releases/download/" + tag + "/" + name
              request = urllib.request.Request(download, headers={"User-Agent": "DandyRecruiterAHK-release-verification"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  downloaded = response.read()
              assert downloaded == files[name][0], "Public download differs from tested source"
              downloads[name] = download

          # Read API metadata with the existing temporary credential to avoid
          # shared-runner public API limits. Both script downloads remain
          # unauthenticated and never receive the workflow credential.
          latest = api("releases/latest")
          assert latest["id"] == release_id and latest["tag_name"] == tag, "Latest release identity mismatch"
          assert latest["draft"] is False and latest["prerelease"] is False, "Latest release is not stable"
          for name, (payload, digest) in files.items():
              latest_download = "https://github.com/" + repo + "/releases/latest/download/" + name
              request = urllib.request.Request(latest_download, headers={"User-Agent": "DandyRecruiterAHK-release-verification"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  downloaded_latest = response.read()
              assert downloaded_latest == payload, "Latest download differs from tested source"
          summary = "Published stable [" + tag + "](" + published["html_url"] + ") with its versioned and latest script downloads verified.\n\n"
          summary += "\n".join("[" + name + "](" + downloads[name] + ") SHA-256: `" + digest + "`"
                               for name, (_, digest) in files.items()) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary)
