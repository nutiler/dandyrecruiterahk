name: Publish reviewed AHK release

# One-time push publication is restricted to this exact owner-requested
# stable release, reviewed commit message and previous main revision.
# Restore the manual-only workflow after verified publication.
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions: {}

concurrency:
  group: dandyrecruiterahk-v1.1.0
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'nutiler/dandyrecruiterahk' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.event.before == '141bf01850a801424f399331d45dd08caac0c95a' &&
        github.event.head_commit.message == 'Publish requested DandyRecruiterAHK 1.1.0 stable release'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate source, attach script and publish stable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: python3 {0}
        run: |
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = "nutiler/dandyrecruiterahk"
          version = "1.1.0"
          tag = "v" + version
          filename = "DandyRecruiterHelper.ahk"
          expected = "9041cc0c0f0d99406357ee5b311fb2d699b28d4aefcef574f6b87f643ccae14d"
          commit = os.environ["RELEASE_COMMIT"]
          token = os.environ["GH_TOKEN"]
          assert re.fullmatch(r"[0-9a-f]{40}", commit), "Invalid commit"
          assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version), "Stable version required"

          def api(path, method="GET", payload=None, binary=False):
              host = "https://uploads.github.com" if binary else "https://api.github.com"
              url = host + "/repos/" + repo + "/" + path
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "User-Agent": "DandyRecruiterAHK-release",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              data = None
              if payload is not None:
                  data = payload if binary else json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/octet-stream" if binary else "application/json"
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          # Refuse to replace a published release, unresolved draft or old tag.
          releases = api("releases?per_page=100")
          assert len(releases) < 100, "Release history requires a complete audit before publication"
          assert not any(item["tag_name"] == tag for item in releases), "Release/draft already exists; inspect it before retrying"
          try:
              api("git/ref/tags/" + tag)
          except urllib.error.HTTPError as problem:
              if problem.code != 404:
                  raise
          else:
              raise RuntimeError("Tag already exists; never repoint it")

          tree = api("git/trees/" + commit + "?recursive=1")
          allowed = {filename, "README.md", ".github/workflows/release.yml"}
          assert not tree["truncated"], "Incomplete source tree"
          assert {item["path"] for item in tree["tree"] if item["type"] == "blob"} == allowed, "Unexpected public files"
          assert all(item["type"] in {"blob", "tree"} and item["mode"] != "120000" for item in tree["tree"]), "Unexpected source entry"
          source = api("contents/" + filename + "?ref=" + commit)
          assert source["encoding"] == "base64", "Unexpected source encoding"
          script = base64.b64decode(source["content"], validate=False)
          assert hashlib.sha256(script).hexdigest() == expected, "Script differs from reviewed bytes"
          assert "; DandyRecruiterAHK " + version + " -" in script.decode("utf-8-sig"), "Header version mismatch"
          readme = api("contents/README.md?ref=" + commit)
          assert readme["size"] > 0, "Setup instructions missing"

          notes = "\n".join([
              "Download **DandyRecruiterHelper.ahk** under **Assets** below. No source-code ZIP is needed.",
              "",
              "Optional Windows helper for the separately installed DandyRecruiter addon in WoW Forever. Requires AutoHotkey v2.",
              "",
              "1. Install AutoHotkey v2 from https://www.autohotkey.com/.",
              "2. Exit older helper copies, then download the attached script and double-click it. It starts unarmed.",
              "3. In Setup, choose your Step key/button and WoW action key. Defaults are Up/F8; bind the same action key to Recruit next or /dandyrecruit queued in WoW.",
              "4. Focus your recruiter client, close chat/copy input and press Ctrl+Alt+your Step key/button to arm.",
              "5. Press and release your chosen button once per step: Recruit next, copy, finish copying, open chat, paste, send. Check the line before the final press.",
              "",
              "Esc disarms an active cycle. Alt-Tab pauses. Holding the button does not repeat. Ten final invite attempts trigger a 50-second pause by default; a partial batch resets after 30 idle seconds without shortening an active pause. Scans do not count.",
              "",
              "A fresh waiting status uses one separate Escape tap before retrying. Unknown copy, unverifiable paste or an interrupted copy/chat cycle stops input. Close unfinished native input yourself, then explicitly re-arm; stopped attempt totals and active cooldowns are retained.",
              "",
              "Use tray Setup to change controls or the optional ten-attempt pause. Saving disarms every client. Use matching DandyRecruiter addon builds; the addon is installed separately.",
              "",
              "Keyboard /who fallback requires a newer matching addon build. Otherwise, use Scan next or Wingman to obtain Ready candidates first.",
              "",
              "[Full setup and controls](https://github.com/" + repo + "/blob/" + commit + "/README.md)",
              "",
              "Script SHA-256: `" + expected + "`",
          ])
          release = api("releases", "POST", {
              "tag_name": tag, "target_commitish": commit,
              "name": "DandyRecruiterAHK " + version,
              "body": notes, "draft": True, "prerelease": False,
              "generate_release_notes": False,
          })
          release_id = release["id"]
          asset = api("releases/" + str(release_id) + "/assets?name=" + urllib.parse.quote(filename), "POST", script, binary=True)
          assert asset["name"] == filename and asset["size"] == len(script), "Asset identity mismatch"
          assert asset["state"] == "uploaded" and asset.get("digest") == "sha256:" + expected, "Asset hash mismatch"
          assets = api("releases/" + str(release_id) + "/assets")
          assert len(assets) == 1 and assets[0]["id"] == asset["id"], "Unexpected release assets"
          published = api("releases/" + str(release_id), "PATCH", {"draft": False, "prerelease": False, "make_latest": "true"})
          assert published["id"] == release_id and published["tag_name"] == tag, "Published release identity mismatch"
          assert published["draft"] is False and published["prerelease"] is False, "Stable publication failed"
          reference = api("git/ref/tags/" + tag)
          assert reference["object"]["type"] == "commit" and reference["object"]["sha"] == commit, "Release tag mismatch"

          # Public readback uses no authentication and never executes the file.
          # Draft URLs can change on publication; re-read the published asset.
          public_assets = api("releases/" + str(release_id) + "/assets")
          assert len(public_assets) == 1 and public_assets[0]["id"] == asset["id"], "Published asset mismatch"
          public_asset = public_assets[0]
          assert public_asset["name"] == filename and public_asset["size"] == len(script)
          assert public_asset.get("digest") == "sha256:" + expected
          download = public_asset["browser_download_url"]
          assert download == "https://github.com/" + repo + "/releases/download/" + tag + "/" + filename
          request = urllib.request.Request(download, headers={"User-Agent": "DandyRecruiterAHK-release-verification"})
          with urllib.request.urlopen(request, timeout=30) as response:
              downloaded = response.read()
          assert downloaded == script, "Public download differs from tested source"

          # Verify the stable latest-release entry and its convenience download
          # without forwarding the workflow credential to either public link.
          request = urllib.request.Request("https://api.github.com/repos/" + repo + "/releases/latest", headers={
              "Accept": "application/vnd.github+json",
              "User-Agent": "DandyRecruiterAHK-release-verification",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              latest = json.load(response)
          assert latest["id"] == release_id and latest["tag_name"] == tag, "Latest release identity mismatch"
          assert latest["draft"] is False and latest["prerelease"] is False, "Latest release is not stable"
          latest_download = "https://github.com/" + repo + "/releases/latest/download/" + filename
          request = urllib.request.Request(latest_download, headers={"User-Agent": "DandyRecruiterAHK-release-verification"})
          with urllib.request.urlopen(request, timeout=30) as response:
              downloaded_latest = response.read()
          assert downloaded_latest == script, "Latest download differs from tested source"
          summary = "Published stable [" + tag + "](" + published["html_url"] + ") with verified [versioned AHK download](" + download + ") and [latest AHK download](" + latest_download + ").\n\nSHA-256: `" + expected + "`\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary)
